[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-device-manager"
version = "0.2.0"
description = "A read-only Windows-style device manager for Linux"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.7; platform_system == 'Linux'",
    "PySide6>=6.7; platform_system != 'Linux'",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
device-manager = "linux_device_manager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
